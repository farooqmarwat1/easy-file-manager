name: Build release ZIP

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build easy-file-manager.zip
        run: |
          mkdir -p build/easy-file-manager
          rsync -a --exclude-from=.distignore ./ build/easy-file-manager/
          cd build && zip -rq ../easy-file-manager.zip easy-file-manager

      - name: Attach ZIP to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" easy-file-manager.zip --clobber
